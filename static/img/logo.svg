  <!-- cheek vents -->
  <circle cx="17.4" cy="42.6" r="1.15" fill="#035C58" opacity="0.3"/>
  <circle cx="46.6" cy="42.6" r="1.15" fill="#035C58" opacity="0.3"/>
</svg>
