<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="cat" role="img" aria-label="Pixel the robot cat mascot">
  <!-- Pixel, redrawn. The previous version had every shape doubled with a
       translucent copy behind it for a shadow, which at the size this
       actually appears read as a blur rather than depth. This one uses one
       solid shape per part, a heavier eye, and a rounder head, so it still
       looks like something at 44px in the corner of the screen. -->
  <defs>
    <linearGradient id="mHead" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#7FCDD3"/><stop offset="1" stop-color="#02848B"/>
    </linearGradient>
    <linearGradient id="mVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE4F4"/><stop offset="1" stop-color="#C3A2D0"/>
    </linearGradient>
    <linearGradient id="mBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7FAB"/><stop offset="1" stop-color="#6F6291"/>
    </linearGradient>
  </defs>

  <!-- body: a single rounded shape, wider at the base so he sits rather
       than floats -->
  <path d="M27 86 q0-19 23-19 t23 19 z" fill="url(#mBody)"/>
  <path d="M36 86 q0-10 14-10 t14 10 z" fill="#D7C4E2"/>

  <!-- tail -->
  <g class="cat-tail">
    <path d="M71 81 q15 3 14-12 q-1-10-9-10" fill="none" stroke="#55B9C0"
          stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="76" cy="59" r="3.6" fill="#C3A2D0"/>
  </g>

  <!-- ears -->
  <g class="cat-ear cat-ear-l">
    <path d="M22 32 L24 10 Q24.4 7.2 27.2 8.9 L41.5 19 Z" fill="#02848B"/>
    <path d="M26.4 27.6 L27.8 16.4 L36 22 Z" fill="#C3A2D0"/>
  </g>
  <g class="cat-ear cat-ear-r">
    <path d="M78 32 L76 10 Q75.6 7.2 72.8 8.9 L58.5 19 Z" fill="#02848B"/>
    <path d="M73.6 27.6 L72.2 16.4 L64 22 Z" fill="#C3A2D0"/>
  </g>

  <!-- headphones -->
  <rect x="6" y="43" width="12" height="20" rx="6" fill="#6F6291"/>
  <rect x="8.8" y="46.6" width="6.4" height="12.8" rx="3.2" fill="#D7C4E2"/>
  <rect x="82" y="43" width="12" height="20" rx="6" fill="#6F6291"/>
  <rect x="84.8" y="46.6" width="6.4" height="12.8" rx="3.2" fill="#D7C4E2"/>

  <!-- head -->
  <rect x="15" y="21" width="70" height="57" rx="27" fill="url(#mHead)"/>
  <path d="M15 38 A27 27 0 0 1 42 21 h16 A27 27 0 0 1 85 38 Z" fill="url(#mVisor)"/>
  <circle cx="50" cy="28" r="2.2" fill="#02848B" opacity=".55"/>

  <!-- eyes: solid and dark, so they hold at any size, with one bright
       highlight each to keep him friendly rather than blank -->
  <g class="cat-eyes">
    <ellipse class="cat-eye" cx="36.5" cy="53" rx="9.4" ry="10.6" fill="#2E2545"/>
    <ellipse cx="33.4" cy="49" rx="3.2" ry="3.6" fill="#FDFAF0"/>
    <ellipse cx="39.4" cy="57.4" rx="1.5" ry="1.7" fill="#FDFAF0" opacity="0.6"/>
    <ellipse class="cat-eye" cx="63.5" cy="53" rx="9.4" ry="10.6" fill="#2E2545"/>
    <ellipse cx="60.4" cy="49" rx="3.2" ry="3.6" fill="#FDFAF0"/>
    <ellipse cx="66.4" cy="57.4" rx="1.5" ry="1.7" fill="#FDFAF0" opacity="0.6"/>
  </g>

  <!-- muzzle -->
  <path d="M50 67 l-3.2-2.8 h6.4 Z" fill="#024E52"/>
  <path d="M50 67 v2.8 M50 69.8 q-3.2 2.9 -5.6 0 M50 69.8 q3.2 2.9 5.6 0"
        fill="none" stroke="#024E52" stroke-width="2" stroke-linecap="round"/>
</svg>
