<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="cat" role="img" aria-label="Pixel the robot cat mascot">
  <defs>
    <linearGradient id="mHead" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8FD6DB"/><stop offset="1" stop-color="#03969D"/>
    </linearGradient>
    <linearGradient id="mCrown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFE5F3"/><stop offset="1" stop-color="#CAABD5"/>
    </linearGradient>
    <linearGradient id="mEye" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F0E7F5"/><stop offset="0.5" stop-color="#CAABD5"/><stop offset="1" stop-color="#83749F"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6BC4CA" stop-opacity="0.45"/><stop offset="1" stop-color="#6BC4CA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="52" r="46" fill="url(#mGlow)"/>
  <!-- body -->
  <path d="M28 84 q0-16 22-16 t22 16 z" fill="#83749F"/>
  <path d="M36 84 q0-9 14-9 t14 9 z" fill="#CAABD5"/>
  <!-- tail -->
  <g class="cat-tail">
    <path d="M72 80 q14 2 13-12 q-1-9-8-9" fill="none" stroke="#6BC4CA" stroke-width="6" stroke-linecap="round"/>
    <circle cx="77" cy="59" r="3.4" fill="#CAABD5"/>
  </g>
  <!-- ears -->
  <g class="cat-ear cat-ear-l">
    <path d="M24 30 L26 11 Q26.5 8.4 29 10 L42 20 Z" fill="#03969D"/>
    <path d="M28 26 L29.4 15.6 L37 21.4 Z" fill="#CAABD5"/>
  </g>
  <g class="cat-ear cat-ear-r">
    <path d="M76 30 L74 11 Q73.5 8.4 71 10 L58 20 Z" fill="#03969D"/>
    <path d="M72 26 L70.6 15.6 L63 21.4 Z" fill="#CAABD5"/>
  </g>
  <!-- headphones -->
  <rect x="7" y="41" width="12" height="21" rx="6" fill="#83749F"/>
  <rect x="9.8" y="45" width="6.4" height="13" rx="3.2" fill="#CAABD5"/>
  <rect x="81" y="41" width="12" height="21" rx="6" fill="#83749F"/>
  <rect x="83.8" y="45" width="6.4" height="13" rx="3.2" fill="#CAABD5"/>
  <!-- head -->
  <rect x="16" y="20" width="68" height="56" rx="26" fill="url(#mHead)"/>
  <path d="M16 37 A26 26 0 0 1 42 20 h16 A26 26 0 0 1 84 37 Z" fill="url(#mCrown)"/>
  <rect x="16" y="35.8" width="68" height="2.4" fill="#035C58" opacity="0.24"/>
  <circle cx="50" cy="26.5" r="2" fill="#03969D" opacity=".5"/>
  <!-- eyes -->
  <g class="cat-eyes">
    <ellipse cx="37" cy="50" rx="9.2" ry="10.2" fill="#035C58" opacity="0.2" transform="translate(0.4,0.5)"/>
    <ellipse class="cat-eye" cx="37" cy="50" rx="9.2" ry="10.2" fill="url(#mEye)"/>
    <ellipse cx="34.2" cy="46.4" rx="3" ry="3.4" fill="#fff" opacity="0.92"/>
    <ellipse cx="39.6" cy="54.2" rx="1.5" ry="1.7" fill="#fff" opacity="0.55"/>
    <ellipse cx="63" cy="50" rx="9.2" ry="10.2" fill="#035C58" opacity="0.2" transform="translate(0.4,0.5)"/>
    <ellipse class="cat-eye" cx="63" cy="50" rx="9.2" ry="10.2" fill="url(#mEye)"/>
    <ellipse cx="60.2" cy="46.4" rx="3" ry="3.4" fill="#fff" opacity="0.92"/>
    <ellipse cx="65.6" cy="54.2" rx="1.5" ry="1.7" fill="#fff" opacity="0.55"/>
  </g>
  <!-- muzzle -->
  <path d="M50 63.5 l-3.4-2.8 h6.8 Z" fill="#035C58"/>
  <path d="M50 63.5 v3 M50 66.5 q-3.4 3 -6 0 M50 66.5 q3.4 3 6 0"
        fill="none" stroke="#035C58" stroke-width="1.9" stroke-linecap="round" opacity="0.75"/>
  <circle cx="24.5" cy="59" r="1.6" fill="#035C58" opacity="0.26"/>
  <circle cx="75.5" cy="59" r="1.6" fill="#035C58" opacity="0.26"/>
</svg>
